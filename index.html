<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="朝トレ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>朝トレ - 筋トレ記録</title>
</head>
<body>
<header><div class="brand">☀️ 朝トレ</div><div class="date" id="today"></div></header>
<main>
  <section class="hero">
    <p class="eyebrow">TODAY'S WORKOUT</p>
    <h1>今日も、10分だけ。</h1>
    <p>小さく続けて、昨日の自分を超えよう。</p>
    <div class="stats">
      <div><strong id="streak">0</strong><span>日連続</span></div>
      <div><strong id="total">0</strong><span>累計達成日</span></div>
      <div><strong id="progress">0%</strong><span>今日の達成率</span></div>
    </div>
  </section>

  <section class="panel">
    <div class="section-head"><div><p class="eyebrow">CHECKLIST</p><h2>今日のメニュー</h2></div><span id="count" class="count">0 / 6</span></div>
    <div id="tasks"></div>
    <div class="progress-track"><div id="bar"></div></div>
    <p id="message" class="message">1種目ずつチェックしていこう。</p>
    <button id="finish" class="primary" disabled>今日のトレーニングを完了する</button>
  </section>

  <section class="panel">
    <p class="eyebrow">YOUR HISTORY</p><h2>最近の記録</h2>
    <div id="calendar" class="calendar"></div>
    <p class="hint">● はその日に6種目すべて完了した日。</p>
  </section>

  <section class="panel settings">
    <p class="eyebrow">REMINDER</p><h2>朝のリマインダー</h2>
    <label for="reminder">通知したい時刻</label>
    <div class="reminder-row"><input id="reminder" type="time" value="07:00"><button id="saveReminder" class="secondary">保存</button></div>
    <p class="hint" id="reminderNote">時刻を記録できます。iPhoneへの自動プッシュ通知は、公開サーバー側の通知設定が必要です。</p>
  </section>
  <footer>記録はこの端末のブラウザ内に保存されます。ブラウザのデータを消去すると記録も消える場合があります。</footer>
</main>
<script src="app.js"></script>
</body></html>
